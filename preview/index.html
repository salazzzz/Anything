<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Euro Detailing — Canvas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../images/favicon.png">

<!-- the real site stylesheet, so the header is exactly the live one -->
<link rel="stylesheet" href="../styles.css">

<style>
  /* ---------- canvas ---------- */
  html, body { min-height: 100%; }

  body {
    background-color: #060606;
    background-image: url("../images/bg-texture.webp");
    background-repeat: repeat;
  }

  .canvas { min-height: 78vh; }

  /* ---------- primary CTA — "Wet Gloss" ---------- */
  .cta {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 46px;
    padding: 0 1.45rem;
    border-radius: 999px;
    border: 1px solid transparent;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.015em;
    white-space: nowrap;
    text-decoration: none;
    isolation: isolate;

    background: linear-gradient(180deg, #3d78ff 0%, #1743b8 100%);
    color: #ffffff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.32),
                inset 0 -1px 0 rgba(0,0,0,.25),
                0 8px 26px rgba(24,75,194,.5);

    transition: transform .22s cubic-bezier(.2,.7,.3,1),
                box-shadow .22s ease;
  }
  .cta > * { position: relative; z-index: 2; }

  .cta:hover {
    transform: translateY(-2px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4),
                0 14px 36px rgba(47,107,255,.62);
  }
  .cta:active { transform: translateY(0) scale(.985); }

  .cta .arw { flex: none; transition: transform .22s cubic-bezier(.2,.7,.3,1); }
  .cta:hover .arw { transform: translateX(3px); }

  /* wet-look highlight sweeping across on hover */
  .cta::after {
    content: "";
    position: absolute;
    inset: -1px;
    z-index: 1;
    background: linear-gradient(105deg, transparent 32%, rgba(255,255,255,.5) 48%, transparent 64%);
    transform: translateX(-130%);
    transition: transform .75s cubic-bezier(.2,.7,.3,1);
  }
  .cta:hover::after { transform: translateX(130%); }

  @media (prefers-reduced-motion: reduce) {
    .cta, .cta .arw, .cta::after { transition: none !important; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header" id="top">
  <div class="container header-inner">
    <a href="#top" class="brand">
      <img src="../images/logo.webp" alt="Euro Detailing logo" class="logo-image" width="72" height="72" decoding="async">
      <span class="brand-text">
        <span class="brand-name">Euro Detailing</span>
        <span class="brand-subtitle">Mobile car detailing in Newton, MA</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a href="#services">Services</a>
      <a href="../gallery.html">Gallery</a>
      <a href="../testimonials.html" class="nav-hideable">Reviews</a>
      <a href="#faq">FAQ</a>
      <a href="#contact">Contact</a>
      <div class="nav-more-wrap">
        <button type="button" class="nav-more" aria-expanded="false" aria-controls="navMoreMenu">More<span class="nav-more-caret" aria-hidden="true"></span></button>
        <div class="nav-more-menu" id="navMoreMenu" hidden>
          <a href="../testimonials.html">Reviews</a>
        </div>
      </div>
    </nav>

    <div class="header-actions">
      <a href="https://www.instagram.com/euro_detailingg" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Euro Detailing on Instagram">
        <img src="../images/instagram.webp" alt="Euro Detailing on Instagram" width="60" height="60" decoding="async">
      </a>
      <a href="https://www.tiktok.com/@eurodetailing" target="_blank" rel="noopener noreferrer" class="social-link1" aria-label="Euro Detailing on TikTok">
        <img src="../images/tiktok.webp" alt="Euro Detailing on TikTok" width="87" height="74" decoding="async">
      </a>

      <a href="#services" class="cta">
        <span>Book Now</span>
        <svg class="arw" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </div>
</header>

<main id="main-content" class="canvas">
  <!-- blank canvas -->
</main>

<!-- real site script: powers the mobile "More" dropdown -->
<script src="../script.js" defer></script>
</body>
</html>
